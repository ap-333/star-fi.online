<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none">
  <defs>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#c0c8d8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <!-- Orbiting star with signal -->
  <g transform="translate(32, 32)">
    <!-- Elliptical orbit -->
    <ellipse cx="0" cy="0" rx="22" ry="9" stroke="url(#g3)" stroke-width="1.5" fill="none" opacity="0.5" transform="rotate(-30)"/>
    <!-- Star -->
    <path d="M 0 -10 L 2.5 -2.5 L 10 -2.5 L 4 2 L 6.5 10 L 0 5 L -6.5 10 L -4 2 L -10 -2.5 L -2.5 -2.5 Z" fill="url(#g3)"/>
    <!-- Small dot on orbit (satellite) -->
    <circle cx="17" cy="-10" r="2.5" fill="url(#g3)"/>
  </g>
  <!-- Wordmark -->
  <text x="68" y="42" font-family="Archivo, system-ui, sans-serif" font-weight="800" font-size="30" letter-spacing="2" fill="#ffffff">STAR-FI</text>
</svg>