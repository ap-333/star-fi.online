<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none">
  <defs>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#9098a8"/>
    </linearGradient>
  </defs>
  <!-- Star formed by signal waves -->
  <g transform="translate(32, 32)">
    <!-- 4-point star outline -->
    <path d="M 0 -22 L 5 -5 L 22 0 L 5 5 L 0 22 L -5 5 L -22 0 L -5 -5 Z" stroke="url(#g4)" stroke-width="2" fill="none" stroke-linejoin="round"/>
    <!-- Wi-fi arcs as star fill -->
    <path d="M -8 -12 A 15 15 0 0 1 8 -12" stroke="url(#g4)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M -12 -6 A 22 22 0 0 1 12 -6" stroke="url(#g4)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
    <circle cx="0" cy="-16" r="3" fill="url(#g4)"/>
  </g>
  <!-- Wordmark -->
  <text x="68" y="42" font-family="Archivo, system-ui, sans-serif" font-weight="800" font-size="30" letter-spacing="2" fill="#ffffff">STAR-FI</text>
</svg>