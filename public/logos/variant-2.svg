<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none">
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#8892a4"/>
    </linearGradient>
  </defs>
  <!-- Star made of connected nodes -->
  <g transform="translate(32, 32)" stroke="url(#g2)" stroke-width="2" fill="none">
    <!-- Outer pentagram shape -->
    <path d="M 0 -20 L 6 -6 L 20 -6 L 9 3 L 13 17 L 0 9 L -13 17 L -9 3 L -20 -6 L -6 -6 Z" stroke-linejoin="round" stroke-width="2"/>
    <!-- Wi-fi arcs inside -->
    <path d="M -10 -10 A 14 14 0 0 1 10 -10" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -6 -14 A 20 20 0 0 1 6 -14" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <circle cx="0" cy="-16" r="2" fill="url(#g2)" stroke="none"/>
  </g>
  <!-- Wordmark -->
  <text x="68" y="42" font-family="Archivo, system-ui, sans-serif" font-weight="800" font-size="30" letter-spacing="2" fill="#ffffff">STAR-FI</text>
</svg>