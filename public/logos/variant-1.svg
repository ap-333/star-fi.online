<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a0a8b8"/>
    </linearGradient>
  </defs>
  <!-- Signal arcs forming a star -->
  <g transform="translate(32, 32)">
    <!-- Outer arc -->
    <path d="M -18 -18 A 25.5 25.5 0 0 1 18 -18" stroke="url(#g1)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <!-- Middle arc -->
    <path d="M -12 -24 A 27 27 0 0 1 12 -24" stroke="url(#g1)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
    <!-- Inner arc -->
    <path d="M -6 -29 A 30 30 0 0 1 6 -29" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4"/>
    <!-- Star center (4-point spark) -->
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="url(#g1)"/>
  </g>
  <!-- Wordmark -->
  <text x="68" y="42" font-family="Archivo, system-ui, sans-serif" font-weight="800" font-size="30" letter-spacing="2" fill="#ffffff">STAR-FI</text>
</svg>