<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starfi Logo Variants - V2 Series</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0f13;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
      gap: 32px;
      min-height: 100vh;
    }
    h1 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #666;
      font-weight: 500;
    }
    h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #444;
      font-weight: 400;
    }
    .card {
      background: #181b20;
      border: 1px solid #2a2d35;
      border-radius: 16px;
      padding: 48px 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 360px;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: #4a5060; }
    .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #555;
      margin-top: -16px;
    }
  </style>
</head>
<body>
  <h1>Starfi Logo - V2 Improved Series</h1>
  <h2>Based on Variant 2 (Connected Star) with enhanced Wi-fi wave visibility</h2>
  <div class="card"><img src="/logos/v2-1.svg" width="240" height="64" alt="V2.1"></div>
  <p class="label">V2.1 - Bold arcs, subtle star outline</p>
  <div class="card"><img src="/logos/v2-2.svg" width="240" height="64" alt="V2.2"></div>
  <p class="label">V2.2 - Arcs nested inside star, thicker strokes</p>
  <div class="card"><img src="/logos/v2-3.svg" width="240" height="64" alt="V2.3"></div>
  <p class="label">V2.3 - Upward offset arcs, star outline visible</p>
  <div class="card"><img src="/logos/v2-4.svg" width="240" height="64" alt="V2.4"></div>
  <p class="label">V2.4 - Extra bold arcs, high contrast</p>
</body>
</html>
